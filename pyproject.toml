[project]
name = "evf"
version = "0.3.0-beta"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Pillow",
    "numpy",
    # tetra3rs transitively pulls gaia-catalog (~17 MB bundled Gaia DR3 +
    # Hipparcos blob). gaia-catalog is needed by scripts/build_tetra3rs_catalog.py
    # to regenerate data/tetra3rs_gaia.bin; the runtime path
    # (SolverDatabase.load_from_file) doesn't import gaia_catalog.
    "tetra3rs==0.7.1",
    "playsound3",
    "aiohttp",
    "pyerfa>=2.0.0",
]

[dependency-groups]
# Desktop window (pywebview). Installed by default — `uv sync` and the
# macOS / Windows / Linux-laptop builds are unchanged — but left out of the
# headless Raspberry Pi package (`pushnav-headless`), which never opens a
# window. main.py imports webview only on the windowed path.
desktop = [
    "pywebview>=5.0",
    # Linux: pull QtPy + PyQt6 + PyQt6-WebEngine. pywebview's GTK backend
    # would need PyGObject + WebKit2GTK from system packages (apt) and
    # forces a --system-site-packages venv that fights the repo's
    # .python-version pin. Qt is pip-installable, uses uv-managed Python,
    # and QtWebEngine renders MJPEG natively (no polling fallback needed).
    "pywebview[qt]>=5.0 ; sys_platform == 'linux'",
]
dev = [
    "nuitka>=4.0.2",
    "pytest",
    "pytest-asyncio>=0.23",
    # macOS DMG layout (writes .DS_Store directly via ds-store + mac-alias —
    # avoids the Sequoia AppleScript / Finder Automation regression that
    # breaks create-dmg's icon positioning). macOS-only at runtime.
    "dmgbuild>=1.6.5; sys_platform == 'darwin'",
    # Tests parse packaging/headless/user-data; scripts/sync_catalog.py too.
    "pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/evf"]

[tool.uv]
default-groups = ["dev", "desktop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
